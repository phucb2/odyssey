[project]
name = "odyssey"
version = "0.1.0"
description = "Odyssey Python library"
readme = "README.md"
authors = [
    { name = "Phuc Bui", email = "buibaphuc95@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "transformers>=4.50.0",
    "torcheval>=0.0.7",
    "fastcore>=1.7.0",
    "fastai>=2.7.0",
    "rich>=13.0",
    "matplotlib>=3.8",
    "tensorboard>=2.16",
    "omegaconf>=2.3.1",
    "hydra-core>=1.3.0",
    "scipy>=1.11",
    "dvc[gdrive,gs]>=3.67.1",
    "pyopenssl>=24.0.0",
    "anywidget>=0.9.0",
    "traitlets>=5.14.0",
    "ipywidgets>=8.1.0",
    "accelerate>=1.14.0",
]

[project.scripts]
odyssey = "odyssey.__main__:main"
mltrain = "odyssey.mltrain:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odyssey"]

[tool.hatch.build.targets.wheel.force-include]
"src/odyssey/viz/static/arch_editor.js" = "odyssey/viz/static/arch_editor.js"
"src/odyssey/viz/static/arch_editor.css" = "odyssey/viz/static/arch_editor.css"

[tool.hatch.build.targets.sdist]
include = ["src/odyssey"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv.sources]
# CUDA builds are not published for macOS; fall back to PyPI there.
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
